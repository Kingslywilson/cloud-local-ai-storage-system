<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Folders - Cloud Storage</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-container">
    <!-- GLOBAL SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo-icon">☁️</div>
        <span class="sidebar-brand-text">CloudVault AI</span>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item" id="nav-dashboard">
          <span class="nav-icon">📊</span>
          <span>Dashboard</span>
        </a>
        <a href="files.html" class="nav-item" id="nav-files">
          <span class="nav-icon">📁</span>
          <span>All Files</span>
        </a>
        <a href="upload.html" class="nav-item" id="nav-upload">
          <span class="nav-icon">📤</span>
          <span>Upload</span>
        </a>
        <a href="folders.html" class="nav-item active" id="nav-folders">
          <span class="nav-icon">📂</span>
          <span>Folders</span>
        </a>
        <a href="shared.html" class="nav-item" id="nav-shared">
          <span class="nav-icon">🔗</span>
          <span>Shared Files</span>
        </a>
        <a href="storage.html" class="nav-item" id="nav-storage">
          <span class="nav-icon">💾</span>
          <span>Storage</span>
        </a>
        <a href="activity.html" class="nav-item" id="nav-activity">
          <span class="nav-icon">📜</span>
          <span>Activity</span>
        </a>
        <a href="profile.html" class="nav-item" id="nav-profile">
          <span class="nav-icon">👤</span>
          <span>Profile</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <button type="button" class="logout-btn" id="logout-btn">
          <span>🚪</span> Log Out
        </button>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="main-wrapper">
      <!-- GLOBAL TOP BAR -->
      <header class="topbar">
        <div class="topbar-left">
          <button type="button" class="sidebar-toggle" id="sidebar-toggle">☰</button>
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="global-search" class="search-input" placeholder="Search files...">
          </div>
        </div>

        <div class="topbar-right">
          <button type="button" class="icon-btn" id="notification-btn" title="Notifications">🔔</button>
          <div class="user-profile-menu" id="user-menu" onclick="window.location.href='profile.html'">
            <div class="user-avatar">U</div>
            <span class="user-name-text" id="user-name">Loading...</span>
          </div>
        </div>
      </header>

      <!-- CONTENT BODY -->
      <main class="content-body">
        <div class="page-header">
          <div>
            <h1 class="page-title">Folder Management</h1>
            <p class="page-subtitle">Organize your cloud files into custom structured folders.</p>
          </div>
          <button type="button" class="btn btn-primary" id="create-folder-btn">📂 New Folder</button>
        </div>

        <!-- FOLDERS GRID CONTAINER -->
        <div id="folders-container" class="grid-4" style="margin-bottom:2.5rem;">
          <!-- Folder cards rendered dynamically -->
        </div>

        <!-- FOLDER FILES CONTENT SECTION -->
        <div id="folder-files-section" style="display:none;">
          <div class="card-table">
            <div class="table-header">
              <h2 class="table-title" id="folder-files-title">Files in Folder</h2>
            </div>
            <div class="table-wrapper">
              <table id="folder-files-table">
                <thead>
                  <tr>
                    <th>File Name</th>
                    <th>Type</th>
                    <th>Size</th>
                    <th>Uploaded</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <!-- Folder files rendered dynamically -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- CREATE FOLDER MODAL -->
  <div id="folder-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Create New Folder</h3>
        <button type="button" id="folder-cancel-x" onclick="document.getElementById('folder-modal').classList.remove('active')" style="background:none; border:none; color:var(--text-muted); font-size:1.2rem; cursor:pointer;">✕</button>
      </div>

      <form id="folder-form">
        <div class="form-group">
          <label for="folder-name" class="form-label">Folder Name</label>
          <input type="text" id="folder-name" class="form-control" placeholder="e.g. Invoices, Projects 2026" required>
        </div>

        <div class="modal-footer">
          <button type="button" id="folder-cancel" class="btn btn-secondary">Cancel</button>
          <button type="submit" id="folder-submit" class="btn btn-primary">Create Folder</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/folders.js"></script>
</body>
</html>
