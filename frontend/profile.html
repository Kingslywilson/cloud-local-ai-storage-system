<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile & Settings - Cloud Storage</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-container">
    <!-- GLOBAL SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo-icon">☁️</div>
        <span class="sidebar-brand-text">CloudVault AI</span>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item" id="nav-dashboard">
          <span class="nav-icon">📊</span>
          <span>Dashboard</span>
        </a>
        <a href="files.html" class="nav-item" id="nav-files">
          <span class="nav-icon">📁</span>
          <span>All Files</span>
        </a>
        <a href="upload.html" class="nav-item" id="nav-upload">
          <span class="nav-icon">📤</span>
          <span>Upload</span>
        </a>
        <a href="folders.html" class="nav-item" id="nav-folders">
          <span class="nav-icon">📂</span>
          <span>Folders</span>
        </a>
        <a href="shared.html" class="nav-item" id="nav-shared">
          <span class="nav-icon">🔗</span>
          <span>Shared Files</span>
        </a>
        <a href="storage.html" class="nav-item" id="nav-storage">
          <span class="nav-icon">💾</span>
          <span>Storage</span>
        </a>
        <a href="activity.html" class="nav-item" id="nav-activity">
          <span class="nav-icon">📜</span>
          <span>Activity</span>
        </a>
        <a href="profile.html" class="nav-item active" id="nav-profile">
          <span class="nav-icon">👤</span>
          <span>Profile</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <button type="button" class="logout-btn" id="logout-btn">
          <span>🚪</span> Log Out
        </button>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="main-wrapper">
      <!-- GLOBAL TOP BAR -->
      <header class="topbar">
        <div class="topbar-left">
          <button type="button" class="sidebar-toggle" id="sidebar-toggle">☰</button>
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="global-search" class="search-input" placeholder="Search files...">
          </div>
        </div>

        <div class="topbar-right">
          <button type="button" class="icon-btn" id="notification-btn" title="Notifications">🔔</button>
          <div class="user-profile-menu" id="user-menu" onclick="window.location.href='profile.html'">
            <div class="user-avatar">U</div>
            <span class="user-name-text" id="user-name">Loading...</span>
          </div>
        </div>
      </header>

      <!-- CONTENT BODY -->
      <main class="content-body">
        <div class="page-header">
          <div>
            <h1 class="page-title">Profile Settings</h1>
            <p class="page-subtitle">Manage your account information and preferences.</p>
          </div>
          <button type="button" class="btn btn-danger" id="profile-logout-btn">🚪 Sign Out</button>
        </div>

        <div style="max-width: 680px;">
          <div class="stat-card" style="display:block; padding:2rem;">
            <div style="display:flex; align-items:center; gap:1.25rem; margin-bottom:2rem; padding-bottom:1.5rem; border-bottom:1px solid var(--border-color);">
              <div class="user-avatar" style="width:64px; height:64px; font-size:1.75rem;">U</div>
              <div>
                <h2 style="font-size:1.3rem; font-weight:700; color:var(--text-main);">User Account</h2>
                <p style="font-size:0.85rem; color:var(--text-muted);">Joined: <span id="profile-created">Active Account</span></p>
              </div>
            </div>

            <div class="form-group">
              <label for="profile-name" class="form-label">Full Name</label>
              <input type="text" id="profile-name" class="form-control" disabled value="Loading...">
            </div>

            <div class="form-group" style="margin-bottom:1.5rem;">
              <label for="profile-email" class="form-label">Email Address</label>
              <input type="email" id="profile-email" class="form-control" disabled value="Loading...">
            </div>

            <div style="display:flex; gap:0.75rem; justify-content:flex-end; margin-top:1.5rem;">
              <button type="button" id="edit-profile-btn" class="btn btn-primary">✏️ Edit Profile</button>
              <button type="button" id="cancel-profile-btn" class="btn btn-secondary" style="display:none;">Cancel</button>
              <button type="button" id="save-profile-btn" class="btn btn-primary" style="display:none;">💾 Save Changes</button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
